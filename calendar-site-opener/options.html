<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calendar Site Opener Settings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="options">
      <h1>Calendar Site Opener Settings</h1>

      <form id="settingsForm">
        <label>
          カレンダーID
          <select id="calendarId" name="calendarId"></select>
        </label>

        <label>
          予定名の目印
          <input id="marker" name="marker" type="text" placeholder="[OPEN]" />
        </label>

        <label>
          URLが見つからない場合のデフォルトURL
          <input id="defaultUrl" name="defaultUrl" type="url" placeholder="https://chatgpt.com/" />
        </label>

        <label class="checkbox">
          <input id="skipNoUrlEvents" name="skipNoUrlEvents" type="checkbox" />
          URLがない予定は開かない
        </label>

        <label>
          Chromeウィンドウ名
          <input id="targetWindowName" name="targetWindowName" type="text" placeholder="work" />
        </label>
        <p class="hint">※ 同じ名前を入れると同じウィンドウに開きます。予定に [WIN:xxx] / #win:xxx があれば予定側を優先します。</p>

        <label>
          何時間先まで予定を取得するか
          <input id="lookAheadHours" name="lookAheadHours" type="number" min="1" max="720" />
        </label>

        <label>
          予定の再同期間隔・分
          <input id="refreshMinutes" name="refreshMinutes" type="number" min="1" max="1440" />
        </label>

        <label>
          予定時刻を過ぎても開く猶予・分
          <input id="missedGraceMinutes" name="missedGraceMinutes" type="number" min="0" max="1440" />
        </label>

        <label class="checkbox">
          <input id="openActiveTab" name="openActiveTab" type="checkbox" />
          新しいタブをアクティブにする
        </label>

        <label>
          ループ処理開始までの秒数（0-30）
          <input id="loopStartDelaySeconds" name="loopStartDelaySeconds" type="number" min="0" max="30" />
        </label>

        <label>
          音量適用1回目までの秒数（0-60）
          <input id="volumeApplyDelaySeconds1" name="volumeApplyDelaySeconds1" type="number" min="0" max="60" />
        </label>

        <label>
          音量適用2回目までの秒数（0-60）
          <input id="volumeApplyDelaySeconds2" name="volumeApplyDelaySeconds2" type="number" min="0" max="60" />
        </label>

        <label>
          音量適用3回目までの秒数（0-60）
          <input id="volumeApplyDelaySeconds3" name="volumeApplyDelaySeconds3" type="number" min="0" max="60" />
        </label>

        <button type="submit">保存</button>
      </form>

        <section class="status-card">
          <div class="label">予定追加ショートカット</div>
          <p class="hint">ショートカットは Chrome の拡張機能ショートカット画面で自由に変更できます。</p>
          <button id="openShortcuts" type="button" class="secondary">ショートカット設定を開く</button>
        </section>


      <section class="status-card">
        <div class="label">状態</div>
        <div id="status">読み込み中...</div>
      </section>
    </main>

    <script src="options.js"></script>
  </body>
</html>
