<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>予定を追加</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="event-form-page">
    <main class="event-form-wrap">
      <section class="status-card event-form-card">
        <div class="label">予定を追加</div>
        <input id="newTitle" type="text" placeholder="タイトル [OPEN]" />
        <input id="newStart" type="datetime-local" />
        <input id="newEnd" type="datetime-local" />
        <input id="newUrl" type="url" placeholder="https://example.com" />
        <input id="newWindowName" type="text" placeholder="開くウィンドウ名（任意）" />
        <input id="newCloseToken" type="text" placeholder="終了時に閉じるキーワード（任意）" />
        <label class="checkbox event-form-checkbox">
          <input id="autoCloseToggle" type="checkbox" />
          終了時にタブを閉じる（キーワードを自動入力）
        </label>

        <div class="event-form-grid">
          <select id="repeatType">
            <option value="none">繰り返しなし</option>
            <option value="daily">毎日</option>
            <option value="weekdays">平日</option>
            <option value="weekly">毎週</option>
            <option value="monthly">毎月</option>
          </select>
        </div>
        <div class="hint">繰り返しを選んだ場合、停止するまで継続する定期予定を作成します。</div>

        <button id="createEvent">追加</button>
        <div id="status">読み込み中...</div>
      </section>
    </main>
    <script src="create_event.js"></script>
  </body>
</html>
